<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181a16">
  <meta name="description" content="Your personal, offline-first gym training log.">
  <link rel="manifest" href="./app.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Training Log</title>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a href="#today" class="wordmark" aria-label="Training Log home"><span class="brand-mark" aria-hidden="true"></span>Training<span>Log</span></a>
      <span class="connection" id="connection">Local log</span>
    </header>
    <main id="app"></main>
    <nav class="dock" aria-label="Main navigation" id="nav"></nav>
  </div>
  <dialog id="dialog"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript>Enable JavaScript to use Training Log.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
